# Envoy 설정 — vLLM Semantic Router 공식 예시
# (https://github.com/vllm-project/semantic-router/blob/main/deploy/local/envoy.yaml)
# 를 기반으로, 데모 범위에 불필요한 ext_authz(Authorino) 인증 필터를 제거하고
# Gemini 클러스터를 추가한 버전입니다.
#
# 흐름: FastAPI(auto 모드) -> Envoy(8801) -> ext_proc(router:50051, gRPC)가
# 질문을 분류하고 x-selected-model 헤더를 세팅 -> Envoy가 그 헤더 값으로
# 실제 업스트림(OpenAI/Gemini/Anthropic)에 라우팅.

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8801
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-selected-model
                                string_match:
                                  prefix: "claude-"
                          route:
                            cluster: anthropic_api_cluster
                            timeout: 300s
                            host_rewrite_literal: "api.anthropic.com"
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-selected-model
                                string_match:
                                  prefix: "gemini-"
                          route:
                            cluster: gemini_api_cluster
                            timeout: 300s
                            host_rewrite_literal: "generativelanguage.googleapis.com"
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-selected-model
                                string_match:
                                  safe_regex:
                                    regex: "^(gpt-|o1-|o3-|chatgpt-).*"
                          route:
                            cluster: openai_api_cluster
                            timeout: 300s
                            host_rewrite_literal: "api.openai.com"
                        - match:
                            prefix: "/"
                          route:
                            cluster: openai_api_cluster
                            timeout: 300s
                            host_rewrite_literal: "api.openai.com"
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: extproc_service
                      allow_mode_override: true
                      processing_mode:
                        request_header_mode: "SEND"
                        response_header_mode: "SEND"
                        request_body_mode: "BUFFERED"
                        response_body_mode: "BUFFERED"
                        request_trailer_mode: "SKIP"
                        response_trailer_mode: "SKIP"
                      failure_mode_allow: true
                      message_timeout: 300s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      suppress_envoy_headers: true
                stream_idle_timeout: "300s"
                request_timeout: "300s"

  clusters:
    - name: extproc_service
      connect_timeout: 300s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: extproc_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: router
                      port_value: 50051

    - name: openai_api_cluster
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 60s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: openai_api_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api.openai.com
                      port_value: 443
                  hostname: "api.openai.com"
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: api.openai.com

    - name: anthropic_api_cluster
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 60s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: anthropic_api_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api.anthropic.com
                      port_value: 443
                  hostname: "api.anthropic.com"
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: api.anthropic.com

    - name: gemini_api_cluster
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 60s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: gemini_api_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: generativelanguage.googleapis.com
                      port_value: 443
                  hostname: "generativelanguage.googleapis.com"
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: generativelanguage.googleapis.com

admin:
  address:
    socket_address:
      address: "0.0.0.0"
      port_value: 19000
