services:
  backend:
    build:
      context: ./backend
    container_name: backend
    env_file:
      - .env
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - backend_hf_cache:/app/hf-cache
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  backend_hf_cache:
