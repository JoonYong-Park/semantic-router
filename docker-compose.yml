# 서버(온프레미스) 배포용. scripts/deploy.sh가 이 파일로 backend, frontend를 빌드하고
# :8000/health로 확인한다. 데이터는 서버의 DynamoDB Local 볼륨에 둔다
# (AWS로 옮기면 DYNAMODB_ENDPOINT를 비우고 실제 DynamoDB를 쓴다).
# .env에 SERVER_IP, UPLOAD_HOST_DIR, 모델 API 키가 있어야 한다.
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    user: root
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    # 외부에 열지 않는다 (backend만 내부 네트워크로 접근)
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: backend
    env_file:
      - .env
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE: joomini
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      FRONTEND_ORIGIN: http://${SERVER_IP}:3000
    volumes:
      - backend_hf_cache:/hf-cache
      - ${UPLOAD_HOST_DIR}:/data/uploads
    depends_on:
      - dynamodb
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://${SERVER_IP}:8000
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  backend_hf_cache:
  dynamodb_data:
