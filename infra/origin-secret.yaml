AWSTemplateFormatVersion: "2010-09-09"
# CloudFront → API Gateway 사이의 공유 비밀값. CloudFront가 API 요청에 X-Origin-Verify 헤더로 붙이고,
# 백엔드는 이 헤더가 없거나 다르면 403을 준다 → execute-api 주소로 직접 들어오는 요청을 막는다.
# 값은 Secrets Manager가 만들고(사람이 보지 않음), CloudFront 템플릿은 동적 참조로 읽는다.
#
# 배포 (저장소 루트에서, CloudFront 스택보다 먼저):
#   aws cloudformation deploy --profile joomini --region ap-northeast-2 \
#     --stack-name joomini-origin-secret --template-file infra/origin-secret.yaml

Description: Joomini - shared secret header between CloudFront and API Gateway

Resources:
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: joomini/origin-verify
      Description: CloudFront가 API 요청에 붙이는 X-Origin-Verify 값
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

Outputs:
  SecretArn:
    Value: !Ref OriginVerifySecret
