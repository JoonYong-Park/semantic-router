AWSTemplateFormatVersion: "2010-09-09"
# Joomini - CloudFront 단일 도메인. 프론트(Next.js Lambda)와 API(API Gateway + Flask Lambda)를
# 한 도메인 아래로 묶는다. 같은 사이트가 되므로 refresh 쿠키(SameSite=Strict)가 정상 동작하고 CORS가 필요 없다.
#
# 경로
#   /api/*          -> API Gateway (/dev). CloudFront Function이 앞의 /api를 떼고 넘긴다 (/api/chat -> /dev/chat)
#   /_next/static/* -> 프론트 Lambda, 캐시 (빌드마다 파일 이름이 바뀌어 오래 캐시해도 안전)
#   그 밖           -> 프론트 Lambda, 캐시 안 함
#
# 프론트 Lambda Function URL은 OAC(SigV4 서명)로 CloudFront에서 온 요청만 받는다.
#
# 배포 (저장소 루트에서, CloudFront는 전역 서비스지만 스택은 서울 리전에 둔다):
#   aws cloudformation deploy --profile joomini --region ap-northeast-2 \
#     --stack-name joomini-cloudfront --template-file infra/cloudfront.yaml \
#     --parameter-overrides FrontendUrlDomain=<lambda-url 호스트> ApiId=<API Gateway ID> \
#       DomainName=<도메인> HostedZoneId=<Route 53 호스팅 영역 ID> CertificateArn=<certificate.yaml 출력>
#
# 내 도메인(DomainName)을 주면: <도메인>, www.<도메인>을 이 배포에 붙이고 Route 53 Alias 레코드를 만든다.
# www나 *.cloudfront.net 주소로 들어오면 https://<도메인> 으로 301 이동시킨다(로그인 쿠키·콜백이 한 도메인 기준이라).
# 비우면 CloudFront 기본 주소만 쓴다.
#

Description: Joomini - CloudFront single domain (frontend Lambda + API Gateway), optional custom domain

Parameters:
  FrontendUrlDomain:
    Type: String
    Description: 프론트 Lambda Function URL의 호스트 (https://, 끝의 / 없이)
  FrontendFunctionName:
    Type: String
    Default: joomini-frontend
  ApiId:
    Type: String
    Description: Zappa가 만든 REST API ID (joomini-dev)
  ApiStage:
    Type: String
    Default: dev
  DomainName:
    Type: String
    Default: ""
    Description: 서비스 도메인 (예 example.com). 비우면 CloudFront 기본 주소만 쓴다
  HostedZoneId:
    Type: String
    Default: ""
  CertificateArn:
    Type: String
    Default: ""
    Description: us-east-1 ACM 인증서 ARN (infra/certificate.yaml)

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: joomini-frontend-oac
        Description: CloudFront -> 프론트 Lambda Function URL (SigV4)
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  StripApiPrefix:
    Type: AWS::CloudFront::Function
    Properties:
      Name: joomini-strip-api-prefix
      AutoPublish: true
      FunctionConfig:
        Comment: /api/xxx -> /xxx (백엔드 라우트는 /api 없이 정의되어 있다)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = request.uri.replace(/^\/api(?=\/|$)/, '') || '/';
          return request;
        }

  # www.도메인, *.cloudfront.net 으로 온 화면 요청을 대표 도메인으로 보낸다.
  CanonicalHostRedirect:
    Type: AWS::CloudFront::Function
    Condition: HasDomain
    Properties:
      Name: joomini-canonical-host
      AutoPublish: true
      FunctionConfig:
        Comment: 대표 도메인이 아니면 301
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          if (host === '${DomainName}') return request;
          var qs = Object.keys(request.querystring).map(function (k) {
            var q = request.querystring[k];
            return q.multiValue
              ? q.multiValue.map(function (v) { return k + '=' + v.value; }).join('&')
              : k + '=' + q.value;
          }).join('&');
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: { location: { value: 'https://${DomainName}' + request.uri + (qs ? '?' + qs : '') } }
          };
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: joomini
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200   # 한국·일본 포함, 남미·호주 엣지 제외
        Aliases: !If
          - HasDomain
          - [!Ref DomainName, !Sub "www.${DomainName}"]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: frontend
            DomainName: !Ref FrontendUrlDomain
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
          - Id: api
            DomainName: !Sub ${ApiId}.execute-api.${AWS::Region}.amazonaws.com
            OriginPath: !Sub /${ApiStage}
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60   # API Gateway 자체 제한(29초)보다 길게
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations: !If
            - HasDomain
            - - EventType: viewer-request
                FunctionARN: !GetAtt CanonicalHostRedirect.FunctionMetadata.FunctionARN
            - !Ref AWS::NoValue
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # API Gateway는 자기 Host로 와야 하므로 Host만 빼고 헤더·쿠키·쿼리를 모두 넘긴다
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt StripApiPrefix.FunctionMetadata.FunctionARN

  # OAC로 서명된 요청만 프론트 Lambda를 호출할 수 있게, 이 배포만 허용한다.
  FrontendInvokeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FrontendFunctionName
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM
      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  FrontendInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FrontendFunctionName
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      # Function URL 호출은 InvokeFunctionUrl과 InvokeFunction 둘 다 필요하다. 이 조건이 없으면 403.
      InvokedViaFunctionUrl: true
      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # 도메인 → CloudFront (Alias, IPv4/IPv6). Z2FDTNDATAQYW2는 CloudFront 고정 호스팅 영역 ID.
  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}
        - Name: !Sub www.${DomainName}
          Type: A
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}
        - Name: !Sub www.${DomainName}
          Type: AAAA
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}

Outputs:
  DistributionId:
    Value: !Ref Distribution
  CloudFrontUrl:
    Value: !Sub https://${Distribution.DomainName}
  PublicUrl:
    Description: 서비스 주소 (FRONTEND_ORIGIN으로 쓴다)
    Value: !If [HasDomain, !Sub "https://${DomainName}", !Sub "https://${Distribution.DomainName}"]
