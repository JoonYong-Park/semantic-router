# 서버리스 전환(Flask + DynamoDB)용 로컬 개발 환경.
# 기존 FastAPI + Postgres 개발 환경(docker-compose.dev.yml)과 별개로 띄운다.
#   docker compose -f docker-compose.serverless.yml up -d --build
#   docker compose -f docker-compose.serverless.yml run --rm flask python scripts/create_table.py
# 화면: http://localhost:3001 (기존 앱은 그대로 http://localhost:3000)
name: joomini-serverless

services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    # -sharedDb: 자격 증명/리전과 상관없이 DB 파일 하나를 공유한다.
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    user: root
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    ports:
      - "8001:8000"   # 호스트 8000은 기존 FastAPI 백엔드가 쓰므로 8001로 노출

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: dynamodb-admin
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamodb
    ports:
      - "8002:8001"   # 브라우저에서 http://localhost:8002 로 테이블과 아이템 확인

  flask:
    build:
      context: ./backend-flask
      dockerfile: Dockerfile.dev
    container_name: flask-backend
    # 코드 수정으로 개발 서버가 재시작될 때 torch 스레드 때문에 프로세스가 비정상 종료될 수 있어
    # (terminate called without an active exception) 자동으로 다시 띄운다.
    restart: unless-stopped
    env_file:
      - .env   # 모델 API 키 (기존 백엔드와 같은 파일)
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE: joomini
      AWS_REGION: ap-northeast-2
      # DynamoDB Local은 키 값이 영문자와 숫자만이면 아무 값이나 받는다.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      FRONTEND_ORIGIN: http://localhost:3001
      UPLOAD_DIR: /data/uploads
      HF_HOME: /hf-cache
      # 개발 서버 리로더가 torch 같은 설치 패키지 수만 개 파일까지 감시하지 않게 한다.
      FLASK_RUN_EXCLUDE_PATTERNS: "/usr/local/lib/*"
    volumes:
      - ./backend-flask:/app
      - ./uploads-flask:/data/uploads   # 기존 uploads/와 섞이지 않게 따로 둔다
      - hf_cache:/hf-cache
    depends_on:
      - dynamodb
    ports:
      - "5001:5000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5001   # 프론트 코드는 그대로, API 주소만 Flask로
    container_name: frontend-flask
    depends_on:
      - flask
    ports:
      - "3001:3000"

volumes:
  dynamodb_data:
  # 기존 개발 환경이 받아 둔 라우터 모델 캐시(3GB+)를 같이 써서 다시 받지 않는다.
  hf_cache:
    external: true
    name: semantic-router_backend_hf_cache
